<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
  :root{
    --bg: #0f0a1a;
    --bg-soft: #17101f;
    --card: #1c1426;
    --card-hover: #2a1c3a;
    --purple: #9d4edd;
    --purple-deep: #5a189a;
    --purple-glow: rgba(157, 78, 221, 0.35);
    --text: #f1ecf7;
    --text-dim: #9b8fae;
    --border: #2e2240;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, var(--purple-glow), transparent 35%),
      radial-gradient(circle at 85% 90%, rgba(90,24,154,0.25), transparent 40%);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite;
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 64px;
    position: relative;
  }

  @keyframes bgShift{
    0%{ background-position: 0% 0%, 100% 100%; }
    50%{ background-position: 40% 30%, 60% 70%; }
    100%{ background-position: 0% 0%, 100% 100%; }
  }

  @media (prefers-reduced-motion: reduce){ body{ animation: none; } }

  /* ===== Selo de administrador ===== */
  .admin-badge{
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px 6px 6px;
    z-index: 10;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5);
  }

  .admin-badge img{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--purple);
  }

  .admin-badge-text{
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .admin-badge-name{
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
  }

  .admin-badge-role{
    font-size: 0.65rem;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  header{ max-width: 900px; margin: 0 auto 40px; text-align: center; }

  .eyebrow{
    display:inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--purple);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 18px;
    background: rgba(157,78,221,0.08);
  }

  h1{
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  h1 span{ color: var(--purple); }

  header p{ color: var(--text-dim); font-size: 1rem; max-width: 480px; margin: 0 auto; }

  .search-wrap{
    max-width: 480px;
    margin: 28px auto 0;
    position: relative;
  }

  .search-wrap svg{
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-dim);
    pointer-events: none;
  }

  #searchInput{
    width: 100%;
    padding: 13px 16px 13px 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  #searchInput::placeholder{ color: var(--text-dim); }

  #searchInput:focus{
    border-color: var(--purple);
    box-shadow: 0 0 0 3px var(--purple-glow);
  }

  main{ max-width: 1000px; margin: 40px auto 0; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .empty-state{
    text-align: center;
    color: var(--text-dim);
    padding: 48px 16px;
    display: none;
  }

  .card{
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover{
    transform: translateY(-4px);
    border-color: var(--purple);
    background: var(--card-hover);
    box-shadow: 0 12px 28px -10px var(--purple-glow);
  }

  .card-icon{
    width: 100%;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
  }

  .card-icon svg{
    width: 40px;
    height: 40px;
    stroke: var(--purple);
  }

  .card-body{ padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-title{ font-size: 1rem; font-weight: 600; line-height: 1.3; }
  .card-desc{ font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; margin-bottom: 4px; }
  .card-meta{ font-size: 0.72rem; color: var(--text-dim); opacity: 0.8; margin-bottom: 10px; }

  .btn-download{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--purple-deep), var(--purple));
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .btn-download:hover{ opacity: 0.9; transform: scale(1.02); }
  .btn-download svg{ width: 16px; height: 16px; stroke: #fff; }

  footer{
    text-align: center;
    margin-top: 56px;
    color: var(--text-dim);
    font-size: 0.8rem;
    transition: color 0.25s ease;
    cursor: default;
  }
  footer:hover{ color: #c77dff; }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }

  @media (max-width: 520px){
    .admin-badge-text{ display: none; }
  }
</style>
</head>
<body>

  <div class="admin-badge">
    <img src="pfp.png" alt="Coiso">
    <div class="admin-badge-text">
      <span class="admin-badge-name">Coiso</span>
      <span class="admin-badge-role">Admin</span>
    </div>
  </div>

  <header>
    <span class="eyebrow">expantas fovever s2</span>
    <h1>Games<span>Coiso</span></h1>
    <p>Games do Coiso. Clique em baixar e o arquivo já vem direto, sem passar pelo Drive.</p>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar material..." autocomplete="off">
    </div>
  </header>

  <main>
    <div class="grid" id="cardGrid"></div>
    <p class="empty-state" id="emptyState">Nenhum games kiara.</p>
  </main>

  <footer>
    Games organizados por -Coiso Coisudo de Souza.
  </footer>

<script>
  // ===========================================
  // ADICIONE OU EDITE OS MATERIAIS AQUI
  //
  // driveId: pegue do link de compartilhamento do Drive.
  // Ex: https://drive.google.com/file/d/1AbCDefGHijKLmnOP/view
  //                                     ^^^^^^^^^^^^^^^^^^ isso aqui é o ID
  //
  // O arquivo no Drive precisa estar com permissão
  // "Qualquer pessoa com o link" pra funcionar.
  // Arquivos grandes (~25MB+) o Google mostra uma tela de
  // aviso de vírus antes de baixar — isso é do Google, não
  // dá pra tirar. Pra arquivos menores baixa direto.
  // ===========================================
  const materiais = [
    {
      titulo: "Balatro + Mods",
      descricao: "Jogo dopaminico que amo de paixão",
      tipo: "ZIP · 61,5MB",
      driveId: "1gQZASu3qWfbI3iMmSHE8eWNSBN9fsIaH"
    },
    {
      titulo: "Undertale Yellow",
      descricao: "Simplesmente a melhor fan-game do jogo",
      tipo: "ZIP · esqueci MB",
      driveId: "13RzNT6njA8NFmMyyJyvHYGqGG-W7FCjM"
    },
    {
      titulo: "Resumo de Redação",
      descricao: "Estrutura de texto dissertativo-argumentativo.",
      tipo: "RAR · 31,7MB",
      driveId: "1BUZEVbHUpCjfuNnYB0lbprFquYFgATke"
    }
  ];

  const grid = document.getElementById('cardGrid');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  const fileIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
    </svg>`;

  const downloadIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>`;

  function driveDirectLink(id){
    return `https://drive.google.com/uc?export=download&id=${id}`;
  }

  function renderCards(items){
    grid.innerHTML = "";
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-icon">${fileIcon}</div>
        <div class="card-body">
          <div class="card-title">${item.titulo}</div>
          <div class="card-desc">${item.descricao}</div>
          <div class="card-meta">${item.tipo}</div>
          <a class="btn-download" href="${driveDirectLink(item.driveId)}">
            ${downloadIcon} Baixar
          </a>
        </div>
      `;

      grid.appendChild(card);
    });

    emptyState.style.display = items.length ? "none" : "block";
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = materiais.filter(item =>
      item.titulo.toLowerCase().includes(q) ||
      item.descricao.toLowerCase().includes(q)
    );
    renderCards(filtered);
  });

  renderCards(materiais);
</script>

</body>
</html>
